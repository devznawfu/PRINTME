<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
<style>
  body { margin: 0; background: #E8E8E6; }
  * { -webkit-tap-highlight-color: transparent; }
  a { color: #1A1A1A; }
  a:hover { color: #6B6B68; }
  input, button { font-family: inherit; }
  @keyframes pop { from { transform: scale(0.94); opacity: 0 } to { transform: scale(1); opacity: 1 } }
</style>
</helmet>
<div style="min-height: 100vh; background: linear-gradient(180deg, #FFFFFF 0%, #F6F6F5 34%, #ECECEA 100%); font-family: 'DM Sans', system-ui, sans-serif; color: #1A1A1A; max-width: 460px; margin: 0 auto; box-shadow: 0 0 60px rgba(0,0,0,0.07);">

  <div style="padding: 28px 22px 22px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid #E4E4E1;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 30px; font-weight: 700; letter-spacing: -0.03em;">{{ shopName }}</span>
      <span style="width: 9px; height: 9px; border-radius: 50%; background: #1A1A1A;"></span>
    </div>
    <div style="font-size: 15px; color: #6B6B68;">{{ tagline }}</div>
  </div>

  <sc-if value="{{ showForm }}" hint-placeholder-val="{{ true }}">
  <div style="padding: 26px 22px 40px; display: flex; flex-direction: column; gap: 34px;">

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em;">What are we printing?</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <button type="button" onClick="{{ pickPhoto }}" style="{{ photoCardStyle }}">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.6"></circle><path d="M3 16.5l4.5-4 4 3.5 3.5-3 6 5"></path></svg>
          <span style="font-size: 17px; font-weight: 700;">Photo<br />Printing</span>
          <span style="font-size: 13px; color: #6B6B68;">ID photos: 1×1, 2×2, Passport, Visa</span>
        </button>
        <button type="button" onClick="{{ pickDoc }}" style="{{ docCardStyle }}">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5"></path><path d="M9 13h6M9 17h6"></path></svg>
          <span style="font-size: 17px; font-weight: 700;">Document<br />Printing</span>
          <span style="font-size: 13px; color: #6B6B68;">PDFs, forms, copies</span>
        </button>
      </div>
    </div>

    <sc-if value="{{ isPhoto }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px;">
        <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em;">What size?</div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px;">
          <sc-for list="{{ sizes }}" as="s" hint-placeholder-count="4">
            <button type="button" onClick="{{ s.pick }}" style="{{ s.style }}">{{ s.label }}</button>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em;">Add your files</div>

      <input type="file" accept="image/*" capture="environment" ref="{{ camRef }}" onChange="{{ onPick }}" style="display: none;" />
      <input type="file" accept="image/*" multiple="{{ true }}" ref="{{ galRef }}" onChange="{{ onPick }}" style="display: none;" />
      <input type="file" multiple="{{ true }}" ref="{{ fileRef }}" onChange="{{ onPick }}" style="display: none;" />

      <button type="button" onClick="{{ openCamera }}" style="display: flex; align-items: center; gap: 16px; width: 100%; min-height: 76px; padding: 0 20px; border-radius: 16px; border: 1px solid #DEDEDB; background: #FFFFFF; color: #1A1A1A; text-align: left; cursor: pointer;" style-hover="border-color: #1A1A1A;">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: #F2F2F0; display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2.5h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"></path><circle cx="12" cy="13.5" r="3.5"></circle></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 17px; font-weight: 700;">Take a photo</span>
          <span style="font-size: 13.5px; color: #6B6B68;">Use your camera right now</span>
        </span>
      </button>

      <button type="button" onClick="{{ openGallery }}" style="display: flex; align-items: center; gap: 16px; width: 100%; min-height: 76px; padding: 0 20px; border-radius: 16px; border: 1px solid #DEDEDB; background: #FFFFFF; color: #1A1A1A; text-align: left; cursor: pointer;" style-hover="border-color: #1A1A1A;">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: #F2F2F0; display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="14" height="14" rx="2"></rect><circle cx="11.5" cy="7.5" r="1.3"></circle><path d="M7 13l3.5-3 3 2.5 2.5-2 5 4.5"></path><path d="M17 21H5a2 2 0 0 1-2-2V7"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 17px; font-weight: 700;">Choose from gallery</span>
          <span style="font-size: 13.5px; color: #6B6B68;">Pictures already on your phone</span>
        </span>
      </button>

      <button type="button" onClick="{{ openFiles }}" style="display: flex; align-items: center; gap: 16px; width: 100%; min-height: 76px; padding: 0 20px; border-radius: 16px; border: 1px solid #DEDEDB; background: #FFFFFF; color: #1A1A1A; text-align: left; cursor: pointer;" style-hover="border-color: #1A1A1A;">
        <span style="width: 44px; height: 44px; border-radius: 12px; background: #F2F2F0; display: flex; align-items: center; justify-content: center; flex: none;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9z"></path><path d="M13 3v6h6"></path></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 17px; font-weight: 700;">Pick a file</span>
          <span style="font-size: 13.5px; color: #6B6B68;">PDF, Word, anything else</span>
        </span>
      </button>

      <sc-if value="{{ hasFiles }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px;">
          <sc-for list="{{ files }}" as="f" hint-placeholder-count="0">
            <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: #F2F2F0;">
              <span style="width: 7px; height: 7px; border-radius: 50%; background: #1A1A1A; flex: none;"></span>
              <span style="font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;">{{ f.name }}</span>
              <button type="button" onClick="{{ f.remove }}" style="border: none; background: none; color: #6B6B68; font-size: 14px; padding: 8px; cursor: pointer;">Remove</button>
            </div>
          </sc-for>
        </div>
      </sc-if>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <label for="name" style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em;">Your name</label>
      <input id="name" type="text" placeholder="e.g. Maria" value="{{ name }}" onChange="{{ onName }}" style="height: 66px; padding: 0 20px; font-size: 19px; border-radius: 16px; border: 1px solid #DEDEDB; background: #FFFFFF; color: #1A1A1A; outline: none;" style-focus="border-color: #1A1A1A;" />
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px;">
      <label for="code" style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em;">Today's code</label>
      <input id="code" type="text" inputMode="numeric" maxLength="{{ 4 }}" placeholder="Ask staff for today's code" value="{{ code }}" onChange="{{ onCode }}" style="height: 66px; padding: 0 20px; font-size: 19px; letter-spacing: 0.1em; border-radius: 16px; border: 1px solid #DEDEDB; background: #FFFFFF; color: #1A1A1A; outline: none;" style-focus="border-color: #1A1A1A;" />
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 19px; font-weight: 700; letter-spacing: -0.01em;">How many copies?</span>
        <span style="font-size: 13.5px; color: #6B6B68;">of each file</span>
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1px solid #DEDEDB; border-radius: 18px; padding: 6px;">
        <button type="button" onClick="{{ dec }}" style="width: 52px; height: 52px; border-radius: 14px; border: none; background: #F2F2F0; color: #1A1A1A; font-size: 26px; line-height: 1; cursor: pointer;">−</button>
        <span style="min-width: 44px; text-align: center; font-size: 22px; font-weight: 700;">{{ qty }}</span>
        <button type="button" onClick="{{ inc }}" style="width: 52px; height: 52px; border-radius: 14px; border: none; background: #F2F2F0; color: #1A1A1A; font-size: 26px; line-height: 1; cursor: pointer;">+</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <button type="button" onClick="{{ submit }}" style="{{ submitStyle }}">Submit to the counter</button>
      <div style="font-size: 13.5px; color: #6B6B68; text-align: center;">{{ helperText }}</div>
    </div>
  </div>
  </sc-if>

  <sc-if value="{{ submitted }}" hint-placeholder-val="{{ false }}">
    <div style="padding: 56px 26px 60px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; animation: pop 320ms ease-out both;">
      <span style="width: 68px; height: 68px; border-radius: 50%; background: #1A1A1A; display: flex; align-items: center; justify-content: center;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
      </span>
      <div style="font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2;">{{ thanksLine }}</div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 44px; border-radius: 22px; background: #FFFFFF; border: 1px solid #DEDEDB;">
        <span style="font-size: 12.5px; letter-spacing: 0.14em; text-transform: uppercase; color: #6B6B68; font-weight: 500;">Your ticket</span>
        <span style="font-size: 58px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums;">{{ ticket }}</span>
      </div>
      <div style="font-size: 18px; color: #45453F; max-width: 300px; line-height: 1.5;">We'll call your name when it's ready. You can put your phone away.</div>
      <div style="font-size: 14.5px; color: #6B6B68;">{{ orderSummary }}</div>
      <button type="button" onClick="{{ reset }}" style="margin-top: 6px; min-height: 58px; padding: 0 30px; border-radius: 16px; border: 1px solid #DEDEDB; background: transparent; color: #1A1A1A; font-size: 16.5px; font-weight: 700; cursor: pointer;" style-hover="border-color: #1A1A1A;">Send something else</button>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:1180},&quot;shopName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PRINTME!&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tagline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Send us your prints from right where you stand.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;startingTicket&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:14,&quot;min&quot;:1,&quot;max&quot;:900,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { service: 'photo', size: '', code: '', files: [], name: '', qty: 1, submitted: false, ticket: '#014' };

  chip(active) {
    return {
      minHeight: '58px', padding: '0 22px', borderRadius: '999px', fontSize: '17px', fontWeight: 700,
      cursor: 'pointer', transition: 'all 140ms ease',
      border: active ? '2px solid #1A1A1A' : '1px solid #DEDEDB',
      background: active ? '#1A1A1A' : '#FFFFFF',
      color: active ? '#FFFFFF' : '#1A1A1A'
    };
  }

  constructor(props) {
    super(props);
    this.camRef = React.createRef();
    this.galRef = React.createRef();
    this.fileRef = React.createRef();
  }

  card(active) {
    return {
      display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: '12px',
      padding: '20px 16px 18px', minHeight: '160px', borderRadius: '20px', cursor: 'pointer',
      textAlign: 'left', lineHeight: 1.25,
      border: active ? '2px solid #1A1A1A' : '1px solid #DEDEDB',
      background: active ? '#FFFFFF' : '#FAFAF9',
      color: '#1A1A1A',
      boxShadow: active ? '0 6px 18px rgba(0,0,0,0.10)' : 'none',
      transition: 'all 140ms ease'
    };
  }

  addFiles(list) {
    const added = Array.from(list || []).map(f => f.name);
    if (!added.length) return;
    this.setState(s => ({ files: s.files.concat(added) }));
  }

  renderVals() {
    const s = this.state;
    const n = s.files.length;
    const isPhoto = s.service === 'photo';
    const codeOk = /^\d{4}$/.test(s.code.trim());
    const sizeOk = !isPhoto || !!s.size;
    const ready = s.name.trim().length > 0 && n > 0 && codeOk && sizeOk;
    return {
      isPhoto,
      code: s.code,
      onCode: e => this.setState({ code: e.target.value.replace(/\D/g, '').slice(0, 4) }),
      sizes: ['1×1', '2×2', 'Passport', 'Visa'].map(label => ({
        label,
        style: this.chip(s.size === label),
        pick: () => this.setState({ size: label })
      })),
      shopName: this.props.shopName ?? 'PRINTME!',
      tagline: this.props.tagline ?? 'Send us your prints from right where you stand.',
      showForm: !s.submitted,
      submitted: s.submitted,
      qty: s.qty,
      name: s.name,
      ticket: s.ticket,
      hasFiles: n > 0,
      files: s.files.map((name, i) => ({
        name,
        remove: () => this.setState(st => ({ files: st.files.filter((_, j) => j !== i) }))
      })),
      photoCardStyle: this.card(s.service === 'photo'),
      docCardStyle: this.card(s.service === 'doc'),
      submitStyle: {
        minHeight: '72px', borderRadius: '18px', border: 'none', width: '100%',
        fontSize: '20px', fontWeight: 700, cursor: ready ? 'pointer' : 'default',
        background: ready ? '#1A1A1A' : '#E4E4E1',
        color: ready ? '#FFFFFF' : '#A3A39F',
        boxShadow: ready ? '0 8px 20px rgba(0,0,0,0.18)' : 'none',
        transition: 'all 140ms ease'
      },
      helperText: ready ? 'Bring your phone to the counter if we need you.'
        : !sizeOk ? 'Pick a photo size to continue.'
        : n === 0 ? 'Add at least one file to continue.'
        : s.name.trim().length === 0 ? 'Add your name to continue.'
        : "Enter today's 4-digit code to continue.",
      thanksLine: 'Thanks, ' + (s.name.trim().split(' ')[0] || 'friend') + '!',
      orderSummary: (isPhoto ? 'Photo printing · ' + s.size : 'Document printing') +
        ' · ' + n + (n === 1 ? ' file' : ' files') + ' · ' + s.qty + (s.qty === 1 ? ' copy' : ' copies'),
      pickPhoto: () => this.setState({ service: 'photo' }),
      pickDoc: () => this.setState({ service: 'doc', size: '' }),
      camRef: this.camRef, galRef: this.galRef, fileRef: this.fileRef,
      openCamera: () => this.camRef.current && this.camRef.current.click(),
      openGallery: () => this.galRef.current && this.galRef.current.click(),
      openFiles: () => this.fileRef.current && this.fileRef.current.click(),
      onPick: e => { this.addFiles(e.target.files); e.target.value = ''; },
      onName: e => this.setState({ name: e.target.value }),
      inc: () => this.setState(st => ({ qty: Math.min(99, st.qty + 1) })),
      dec: () => this.setState(st => ({ qty: Math.max(1, st.qty - 1) })),
      submit: () => {
        if (!ready) return;
        const start = this.props.startingTicket ?? 14;
        const num = start + Math.floor(Math.random() * 6);
        this.setState({ submitted: true, ticket: '#' + String(num).padStart(3, '0') });
      },
      reset: () => this.setState({ submitted: false, files: [], name: '', code: '', size: '', qty: 1, service: 'photo' })
    };
  }
}
</script>
</body>
</html>
