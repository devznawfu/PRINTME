{% extends "base.html" %}
{% block title %}PRINTME! &mdash; Pricing{% endblock %}
{% block theme_script %}{% include "admin/partials/_theme_script.html" %}{% endblock %}
{% block body %}
<div class="mx-auto flex max-w-[720px] flex-col gap-8 px-8 py-10">
  <div class="flex items-center justify-between gap-6">
    <div class="flex flex-col gap-1.5">
      <h1 class="text-[30px] font-bold tracking-tight">Pricing</h1>
      <span class="text-lg text-muted">Rates used to auto-total each job.</span>
    </div>
    <a href="{{ url_for('admin_dashboard.dashboard') }}" class="flex min-h-[54px] items-center rounded-2xl border border-line px-6 text-[17px] font-bold">Back to queue</a>
  </div>

  <form method="post" action="{{ url_for('admin_pricing.update_pricing') }}" class="flex flex-col gap-4 rounded-3xl border border-border bg-panel p-6">
    {% for rate in rates %}
    <div class="flex items-center justify-between gap-4 rounded-2xl border border-header-line bg-inset px-4 py-3.5">
      <label for="rate-{{ rate.key }}" class="text-[15px] font-bold">{{ rate_labels.get(rate.key, rate.key) }}</label>
      <div class="flex items-center gap-2">
        <span class="text-lg text-muted">&#8369;</span>
        <input id="rate-{{ rate.key }}" name="{{ rate.key }}" type="number" step="0.01" min="0" value="{{ '%.2f'|format(rate.price) }}" class="h-[46px] w-[110px] rounded-xl border border-line bg-panel px-3 text-right text-[15px]">
      </div>
    </div>
    {% endfor %}
    <button type="submit" class="min-h-[64px] w-full rounded-2xl bg-btn-bg text-lg font-bold text-btn-text">Save rates</button>
  </form>
</div>
{% endblock %}
